# yatr - https://github.com/cargopete/yatr
#
# Task names are the same across every nuthatch-org repo, so `yatr ci` means
# the same thing wherever you are. Note that `ci` is deliberately not called
# `check`: `yatr check` is a builtin that validates this file, and it shadows
# any task of that name without warning.

[settings]
cache = true

[tasks.fmt]
desc = "gofmt the tree"
run = ["gofmt -w ."]
no_cache = true

[tasks.fmt-check]
desc = "Fail if any Go file is unformatted"
shell = true
run = ["test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }"]
sources = ["**/*.go"]

[tasks.lint]
desc = "go vet over every package"
run = ["go vet ./..."]
sources = ["**/*.go", "go.mod", "go.sum"]

[tasks.test]
desc = "Run the Go test suite"
run = ["go test ./..."]
sources = ["**/*.go", "go.mod", "go.sum"]
watch = ["**/*.go"]

[tasks.build]
desc = "Build every command"
run = ["go build ./..."]
sources = ["**/*.go", "go.mod", "go.sum"]

[tasks.proto]
desc = "Regenerate the protobuf bindings (needs buf)"
run = ["buf generate"]
sources = ["proto/**/*.proto", "buf.gen.yaml", "buf.yaml"]

[tasks.tidy]
desc = "go mod tidy"
run = ["go mod tidy"]
no_cache = true

[tasks.ci]
desc = "What CI runs: fmt-check, lint, build, test"
depends = ["fmt-check", "lint", "build", "test"]
run = []
